[package]
name = "matrix-cover-core"
version = "0.5.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
httpdate = "1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
