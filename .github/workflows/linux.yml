name: Linux test and release
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev dbus-daemon libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils webkit2gtk-driver xvfb xauth python3-pil
      - name: Prepare Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            update-core -> target
            cover-core -> target
            src-tauri -> target
      - run: npm ci
      - name: Prepare isolated process-test account
        run: |
          # Keep runner credentials outside disposable native tests. Tests also
          # create a protected same-user process to catch false update refusals.
          sudo useradd --create-home --user-group --shell /bin/bash matrix-test
          sudo chmod 0700 /home/matrix-test
          sudo install -d -o matrix-test -g matrix-test -m 0700 /home/matrix-test/runtime
          sudo install -d -o matrix-test -g matrix-test -m 0755 /home/matrix-test/bin /home/matrix-test/work /home/matrix-test/artifacts
          sudo cp -R tests /home/matrix-test/work/tests
          sudo chown -R matrix-test:matrix-test /home/matrix-test/work/tests
      - name: Verify isolated signed DEB upgrades
        timeout-minutes: 5
        run: |
          # Fixed public, production-signed inputs. No signing secret is needed.
          fixtures="$RUNNER_TEMP/matrix-signed-deb-fixtures"
          mkdir -p "$fixtures"
          for name in update-manifest.json update-manifest.sig Matrix-Play_0.5.13_amd64.deb; do
            curl --fail --location --retry 2 --proto '=https' --tlsv1.2 "https://github.com/relentlesspoetry-coder/Matrix/releases/download/v0.5.13/$name" --output "$fixtures/$name"
          done
          curl --fail --location --retry 2 --proto '=https' --tlsv1.2 'https://github.com/relentlesspoetry-coder/Matrix/releases/download/v0.5.12/Matrix-Play_0.5.12_amd64.deb' --output "$fixtures/seed.deb"
          driver=$(python3 tests/signed_deb_integration.py --build-only --source-root "$PWD" --target-dir "$PWD/update-core/target" --output "$RUNNER_TEMP/matrix-deb-driver")
          # Namespace root cannot override access through runner-owned private
          # home directories. Keep the disposable roots under root-owned /var/tmp.
          integration_root=$(sudo mktemp -d /var/tmp/matrix-deb-integration.XXXXXX)
          trap 'sudo rm -rf -- "$integration_root"' EXIT
          # Only the test's disposable filesystem gets a package transaction.
          # sudo permits namespace creation on hardened Ubuntu runners without
          # weakening their AppArmor or unprivileged-user-namespace settings.
          for mask in 000 002 022 077; do
            output="$integration_root/valid-$mask"
            sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root python3 tests/signed_deb_integration.py --helper "$driver" --release-dir "$fixtures" --seed-deb "$fixtures/seed.deb" --umask "$mask" --output "$output"
            sudo install -m 0644 "$output/report.json" "/home/matrix-test/artifacts/deb-valid-$mask.json"
          done
          for scenario in tamper downgrade; do
            output="$integration_root/$scenario"
            sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root python3 tests/signed_deb_integration.py --helper "$driver" --release-dir "$fixtures" --case "$scenario" --output "$output"
            sudo install -m 0644 "$output/report.json" "/home/matrix-test/artifacts/deb-$scenario.json"
          done
      - name: Test Rust and managed folders
        run: |
          cargo test --locked --manifest-path update-core/Cargo.toml
          cargo test --locked --manifest-path cover-core/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib --no-run --message-format=json > "$RUNNER_TEMP/matrix-headless-tests.json"
          headless=$(python3 scripts/find-test-binary.py "$RUNNER_TEMP/matrix-headless-tests.json" lib src-tauri/src/lib.rs)
          sudo install -o matrix-test -g matrix-test -m 0755 "$headless" /home/matrix-test/bin/backend-tests
          scripts/run-ci-as-test-user.sh /home/matrix-test/bin/backend-tests --test-threads=1
          # Direct desktop cargo tests validate resources before Tauri CLI's hook.
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --no-default-features --bin matrix-install-update --bin matrix-update-coordinator
          cargo test --locked --manifest-path src-tauri/Cargo.toml --bin matrix-frontend --no-run --message-format=json > "$RUNNER_TEMP/matrix-desktop-tests.json"
          desktop=$(python3 scripts/find-test-binary.py "$RUNNER_TEMP/matrix-desktop-tests.json" bin src-tauri/src/main.rs)
          sudo install -o matrix-test -g matrix-test -m 0755 "$desktop" /home/matrix-test/bin/desktop-tests
          scripts/run-ci-as-test-user.sh /home/matrix-test/bin/desktop-tests --test-threads=1
          python3 tests/test_structure.py
          python3 tests/test_ci_process_account.py
          python3 tests/test_native_lifecycle_fixture.py
          python3 tests/test_release.py
          python3 tests/test_deb_package.py
          python3 tests/test_launch_log_lifetime.py
          node --check web/app.js
          node --test tests/test_*.cjs
      - name: Verify live Libretro cover templates
        timeout-minutes: 2
        run: cargo test --locked --manifest-path cover-core/Cargo.toml live_libretro_templates -- --ignored
      - name: Verify live Switch GameTDB cover template
        timeout-minutes: 2
        run: cargo test --locked --manifest-path cover-core/Cargo.toml live_switch_gametdb_template -- --ignored
      - name: Verify private root-owned update staging
        run: |
          # Only this exact fixture runs as root. It creates disposable staging,
          # checks signed synthetic bytes and cleanup, and never runs APT/pkexec.
          cargo test --locked --manifest-path update-core/Cargo.toml --no-run --message-format=json > "$RUNNER_TEMP/matrix-staging-tests.json"
          staging_test=$(python3 scripts/find-test-binary.py "$RUNNER_TEMP/matrix-staging-tests.json" lib update-core/src/lib.rs)
          staging_root=$(sudo mktemp -d /var/tmp/matrix-staging-regression.XXXXXX)
          trap 'sudo rm -rf -- "$staging_root"' EXIT
          sudo install -o root -g root -m 0755 "$staging_test" "$staging_root/staging-tests"
          sudo env -i PATH=/usr/bin:/bin HOME=/root TMPDIR="$staging_root" "$staging_root/staging-tests" --exact deb::tests::staging_creation_is_private_under_common_umasks --nocapture
      - name: Check live artwork providers (informational)
        continue-on-error: true
        timeout-minutes: 3
        run: cargo test --locked --manifest-path cover-core/Cargo.toml live_ -- --ignored --skip live_libretro_templates --skip live_switch_gametdb_template
      - name: Build Linux installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run build:linux -- --ci -- --locked
      - name: Verify packaged update helper
        run: python3 tests/test_deb_package.py src-tauri/target/release/bundle/deb/*.deb
      - name: Check ordinary painted window
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo install -o matrix-test -g matrix-test -m 0755 src-tauri/target/release/matrix-frontend /home/matrix-test/bin/matrix-frontend
          scripts/run-ci-as-test-user.sh dbus-run-session -- xvfb-run -a python3 /home/matrix-test/work/tests/test_normal_startup.py /home/matrix-test/bin/matrix-frontend --screenshot /home/matrix-test/artifacts/normal-startup.png
      - name: Test actual desktop window
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          sudo install -o matrix-test -g matrix-test -m 0755 "$(command -v tauri-driver)" /home/matrix-test/bin/tauri-driver
          for iteration in 1 2; do
            scripts/run-ci-as-test-user.sh dbus-run-session -- xvfb-run -a python3 /home/matrix-test/work/tests/test_native.py /home/matrix-test/bin/matrix-frontend --coordinator-tests /home/matrix-test/bin/backend-tests --screenshots "/home/matrix-test/artifacts/native-$iteration"
          done
      - name: Test extracted AppImage shutdown
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          sudo install -o matrix-test -g matrix-test -m 0755 "${images[0]}" /home/matrix-test/bin/Matrix.AppImage
          for iteration in 1 2; do
            scripts/run-ci-as-test-user.sh dbus-run-session -- xvfb-run -a python3 /home/matrix-test/work/tests/test_native.py /home/matrix-test/bin/Matrix.AppImage --coordinator-tests /home/matrix-test/bin/backend-tests --shutdown-only --screenshots "/home/matrix-test/artifacts/native-appimage-$iteration"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Matrix-Play-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Collect isolated test diagnostics
        if: always()
        run: |
          if sudo test -d /home/matrix-test/artifacts; then
            mkdir -p test-artifacts
            sudo cp -R /home/matrix-test/artifacts/. test-artifacts/
            sudo chown -R "$(id -u):$(id -g)" test-artifacts
          fi
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Matrix-Play-startup-diagnostics
          path: test-artifacts/
          if-no-files-found: warn

  publish:
    needs: linux
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check version publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "An incomplete draft exists for this version. Inspect it before retrying publication."
              exit 1
            fi
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.release.outputs.needed == 'true'
        with:
          name: Matrix-Play-linux-x86_64
          path: src-tauri/target/release/bundle
      - name: Sign validated installers
        if: steps.release.outputs.needed == 'true'
        env:
          MATRIX_UPDATE_SIGNING_KEY: ${{ secrets.MATRIX_UPDATE_SIGNING_KEY }}
        run: python3 scripts/prepare-release.py
      - name: Publish immutable testing release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v$VERSION" release-out/*.deb release-out/*.AppImage release-out/*-source.zip release-out/SHA256SUMS release-out/update-manifest.json release-out/update-manifest.sig --target "$GITHUB_SHA" --title "Matrix Play $VERSION" --notes-file release-out/release-notes.md --draft --prerelease
          gh release edit "v$VERSION" --draft=false
