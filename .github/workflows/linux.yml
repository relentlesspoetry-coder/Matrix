name: Linux test and release
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils webkit2gtk-driver xvfb xauth python3-pil
      - name: Prepare Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            update-core -> target
            cover-core -> target
            src-tauri -> target
      - run: npm ci
      - name: Test Rust and managed folders
        run: |
          cargo test --locked --manifest-path update-core/Cargo.toml
          cargo test --locked --manifest-path cover-core/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib
          cargo test --locked --manifest-path src-tauri/Cargo.toml --bin matrix-frontend
          python3 tests/test_structure.py
          python3 tests/test_release.py
          python3 tests/test_deb_package.py
          python3 tests/test_launch_log_lifetime.py
          node --check web/app.js
          node --test tests/test_*.cjs
      - name: Build Linux installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run build:linux -- --ci -- --locked
      - name: Verify packaged update helper
        run: python3 tests/test_deb_package.py src-tauri/target/release/bundle/deb/*.deb
      - name: Check ordinary painted window
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tests/test_normal_startup.py src-tauri/target/release/matrix-frontend --screenshot test-artifacts/normal-startup.png
      - name: Test actual desktop window
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          xvfb-run -a python3 tests/test_native.py src-tauri/target/release/matrix-frontend --screenshots test-artifacts/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Matrix-Play-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Matrix-Play-startup-diagnostics
          path: test-artifacts/
          if-no-files-found: warn

  publish:
    needs: linux
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check version publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "An incomplete draft exists for this version. Inspect it before retrying publication."
              exit 1
            fi
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.release.outputs.needed == 'true'
        with:
          name: Matrix-Play-linux-x86_64
          path: src-tauri/target/release/bundle
      - name: Sign validated installers
        if: steps.release.outputs.needed == 'true'
        env:
          MATRIX_UPDATE_SIGNING_KEY: ${{ secrets.MATRIX_UPDATE_SIGNING_KEY }}
        run: python3 scripts/prepare-release.py
      - name: Publish immutable testing release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v$VERSION" release-out/*.deb release-out/*.AppImage release-out/*-source.zip release-out/SHA256SUMS release-out/update-manifest.json release-out/update-manifest.sig --target "$GITHUB_SHA" --title "Matrix Play $VERSION" --notes-file release-out/release-notes.md --draft --prerelease
          gh release edit "v$VERSION" --draft=false
