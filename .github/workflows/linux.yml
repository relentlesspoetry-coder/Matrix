name: Linux test build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils webkit2gtk-driver xvfb xauth python3-pil
      - name: Prepare Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            cover-core -> target
            src-tauri -> target
      - run: npm ci
      - name: Test Rust and managed folders
        run: |
          cargo test --locked --manifest-path cover-core/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib
          cargo test --locked --manifest-path src-tauri/Cargo.toml --bin matrix-frontend
          python3 tests/test_structure.py
          node --check web/app.js
      - name: Build Linux installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run build:linux -- --ci -- --locked
      - name: Check ordinary painted window
        run: xvfb-run -a python3 tests/test_normal_startup.py src-tauri/target/release/matrix-frontend
      - name: Test actual desktop window
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          xvfb-run -a python3 tests/test_native.py src-tauri/target/release/matrix-frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Matrix-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
