[package]
name = "matrix-frontend"
version = "0.5.1"
edition = "2021"
authors = ["relentlesspoetry-coder"]
build = "build.rs"
description = "Matrix: console, Steam and Windows game frontend for Linux"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:webkit2gtk"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
matrix-cover-core = { path = "../cover-core" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", optional = true }
