[package]
name = "matrix-frontend"
default-run = "matrix-frontend"
version = "0.6.13"
edition = "2021"
rust-version = "1.90"
authors = ["relentlesspoetry-coder"]
build = "build.rs"
description = "Matrix Play: console, Steam and Windows game frontend for Linux"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:webkit2gtk", "dep:tauri-plugin-dialog"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
tempfile = "3"
matrix-cover-core = { path = "../cover-core" }
matrix-update-core = { path = "../update-core" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", optional = true }
