<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cee4f7">
  <meta name="description" content="Matrix-Play — native Linux frontend for consoles, Steam, and Windows games.">
  <title>Matrix-Play | Your game libraries</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./startup.js" defer></script>
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./gamepad.js" defer></script>
</head>
<body>
  <div id="startup-status" class="startup-status" role="status"><strong>Starting Matrix-Play…</strong><p>Loading your game libraries.</p><button type="button" hidden>Try again</button></div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <button class="brand" data-action="home" type="button" aria-label="Matrix-Play home">
        <img class="brand-logo" src="./assets/matrix-play-icon.png" alt="Matrix-Play">
        <span class="brand-wordmark">Matrix-Play</span><span class="brand-symbol" aria-hidden="true"><img src="./assets/matrix-play-icon.png" alt=""></span>
      </button>
      <nav class="main-nav">
        <button type="button" class="nav-item active" id="nav-consoles" aria-label="Consoles" title="Consoles" data-action="home" aria-current="page">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Consoles</span>
        </button>
        <button type="button" class="nav-item" id="nav-steam" aria-label="Steam Games" title="Steam Games" data-action="steam">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="16.3" cy="7.7" r="2.3"/><path d="m14.8 9.5-4.4 4.4-5-1.7M10.4 13.9l2.5 2.1-1.4 2.4-3.5-1.7"/></svg><span>Steam Games</span>
        </button>
        <button type="button" class="nav-item" id="nav-windows" aria-label="Windows Games" title="Windows Games" data-action="windows">
          <svg viewBox="0 0 24 24"><path d="M3 6 11 4.5v7H3zM13 4l8-1v8.5h-8zM3 13h8v7L3 18zM13 13h8v8l-8-1.5z"/></svg><span>Windows Games</span>
        </button>
        <button type="button" class="nav-item" id="nav-settings" aria-label="Settings" title="Settings" data-action="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M19 13.5v-3l-2-1-1-2 1-2-2.5-1.5-1.5 1.5h-2L9.5 4 7 5.5l1 2-1 2-2 1v3l2 1 1 2-1 2L9.5 20l1.5-1.5h2l1.5 1.5L17 18.5l-1-2 1-2z"/></svg><span>Settings</span>
        </button>
      </nav>
      <div class="sidebar-spacer"></div>
      <span id="native-status" hidden></span>
      <div class="sidebar-version">Matrix-Play <span>v0.6.4</span></div>
    </aside>
    <main class="content">
      <header class="topbar">
        <div class="breadcrumbs" id="breadcrumbs">LIBRARY <span>/</span> CONSOLES</div>
        <div class="topbar-actions">
          <span id="mode-indicator" hidden>UI PREVIEW</span>
          <button type="button" class="icon-button" data-action="refresh" aria-label="Refresh library" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 5.6M20 4v7h-7"/></svg></button>
        </div>
      </header>
      <section class="screen" id="screen" aria-live="polite"></section>
      <p id="controller-help" class="controller-help" hidden>D-pad: move · A: select · B: back · LB / RB: next control</p>

    </main>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <input id="folder-input" type="file" multiple webkitdirectory directory hidden aria-label="Choose games folder">
  <input id="art-input" type="file" accept="image/png,image/jpeg,image/webp" hidden aria-label="Choose game cover image">
</body>
</html>
